name: Harness enforcement

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  protected-artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check protected artifacts against main
        shell: pwsh
        run: |
          $base = 'origin/main'
          git show "${base}:scripts/check_protected.py" 2>$null | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\base_check_protected.py"
          if ($LASTEXITCODE -eq 0) {
            python "$env:RUNNER_TEMP\base_check_protected.py" --repo . --base $base
          } else {
            python scripts/check_protected.py --repo . --base $base
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify checker behavior
        run: python -m unittest discover -s scripts/tests -q

  regression:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: auditdesk/webui/package-lock.json
      - name: Install declared Python test dependencies
        run: python -m pip install pytest -r auditdesk/dsd_workbench/requirements.txt -r auditdesk/dart_explorer/requirements.txt -r DSD_footing/requirements.txt
      - name: Install locked web UI dependencies
        working-directory: auditdesk/webui
        run: npm ci --no-audit --no-fund
      - name: Run all primary project gates
        run: python scripts/test_all.py
